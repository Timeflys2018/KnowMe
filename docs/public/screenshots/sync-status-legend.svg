<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">知识空间文档状态徽标示意</title>
  <desc id="desc">新增文档显示主题色和实心圆点，已更新文档显示空心圆点，已读文档不显示圆点。</desc>
  <rect width="1200" height="320" rx="24" fill="#faf9f6"/>
  <text x="56" y="62" fill="#202124" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700">文件列表里的变化标记</text>
  <text x="56" y="98" fill="#737373" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="18">它只表达“这台设备是否看过最新内容”，不代表同步权限或 Git 状态。</text>

  <g transform="translate(56 136)">
    <rect width="344" height="128" rx="16" fill="#f0fdf4" stroke="#bbf7d0"/>
    <circle cx="34" cy="46" r="8" fill="#16a34a"/>
    <text x="58" y="54" fill="#15803d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="700">新人入职指南.md</text>
    <text x="24" y="94" fill="#166534" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17">新增 · 还没有打开过</text>
    <text x="24" y="116" fill="#4b5563" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15">主题色文件名 + 实心圆点</text>
  </g>

  <g transform="translate(428 136)">
    <rect width="344" height="128" rx="16" fill="#fff7ed" stroke="#fed7aa"/>
    <circle cx="34" cy="46" r="8" fill="#fff7ed" stroke="#737373" stroke-width="2.5"/>
    <text x="58" y="54" fill="#202124" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="700">产品路线图.md</text>
    <text x="24" y="94" fill="#57534e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17">已更新 · 读过后又有变化</text>
    <text x="24" y="116" fill="#4b5563" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15">普通文件名 + 空心圆点</text>
  </g>

  <g transform="translate(800 136)">
    <rect width="344" height="128" rx="16" fill="#f5f5f4" stroke="#e7e5e4"/>
    <text x="24" y="54" fill="#202124" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="700">团队约定.md</text>
    <text x="24" y="94" fill="#57534e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17">已读 · 当前没有新变化</text>
    <text x="24" y="116" fill="#4b5563" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15">普通文件名 + 无圆点</text>
  </g>
</svg>
